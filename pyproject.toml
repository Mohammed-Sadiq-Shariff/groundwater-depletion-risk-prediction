[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwater-risk"
version = "0.1.0"
description = "Groundwater depletion risk prediction for Mysuru District, Karnataka."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Project contributors"}]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

